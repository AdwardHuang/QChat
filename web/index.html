<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QChat - 局域网聊天室</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f5f9;
            font-family: "Microsoft YaHei", Arial, sans-serif;
            color: #303846;
        }

        .container {
            width: 420px;
            max-width: calc(100% - 32px);
            padding: 40px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 30px;
            color: #2878e8;
        }

        .subtitle {
            color: #8490a0;
            font-size: 14px;
        }

        .status {
            margin-top: 30px;
            padding: 14px;
            background: #eaf8ef;
            color: #21864a;
            border-radius: 8px;
            font-size: 14px;
        }

        .version {
            margin-top: 24px;
            color: #a0a8b4;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>QChat</h1>
        <div class="subtitle">轻量级局域网聊天室</div>

        <div class="status">
            ● 服务端运行正常
        </div>

        <div class="version">
            QChat 0.1.0 · 第一个开发版本
        </div>
    </div>
</body>
</html>
